  </defs>

  <!-- Background -->
  <rect width="980" height="1460" fill="#F7F8FC"/>

  <!-- ══════════════════════════════════════════════════════
       TITLE
  ══════════════════════════════════════════════════════ -->
  <text x="490" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A1A2E">CEO Performance Analysis Platform — Complete System Architecture</text>

  <!-- ══════════════════════════════════════════════════════
       LAYER 1: USER
  ══════════════════════════════════════════════════════ -->
  <rect x="365" y="48" width="250" height="56" rx="8" fill="#EAECEE" stroke="#95A5A6" stroke-width="1.5"/>
  <text x="490" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C3E50">User (Web Browser)</text>
  <text x="490" y="92" text-anchor="middle" font-size="11" fill="#666">React Single Page Application</text>

  <!-- Arrow: User → CloudFront -->
  <line x1="490" y1="104" x2="490" y2="134" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="500" y="124" font-size="10" fill="#888">HTTPS</text>

  <!-- ══════════════════════════════════════════════════════
       LAYER 2: CLOUDFRONT
  ══════════════════════════════════════════════════════ -->
  <rect x="210" y="137" width="560" height="56" rx="8" fill="#D6EAF8" stroke="#2E86C1" stroke-width="2"/>
  <text x="490" y="161" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A5276">AWS CloudFront CDN</text>
  <text x="490" y="181" text-anchor="middle" font-size="11" fill="#1A5276">Routes  /*  →  Amplify (frontend)   |   /api/*  →  ECS Backend</text>

  <!-- Fork arrows from CloudFront -->
  <line x1="330" y1="193" x2="190" y2="248" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="218" y="232" font-size="10" fill="#888">/* frontend</text>
  <line x1="650" y1="193" x2="790" y2="248" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="685" y="232" font-size="10" fill="#888">/api/* backend</text>

  <!-- ══════════════════════════════════════════════════════
       LAYER 3: AMPLIFY (left) + ECR→ECS (right)
  ══════════════════════════════════════════════════════ -->

  <!-- Amplify -->
  <rect x="50" y="250" width="280" height="56" rx="8" fill="#D5F5E3" stroke="#1E8449" stroke-width="2"/>
  <text x="190" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#145A32">AWS Amplify</text>
  <text x="190" y="293" text-anchor="middle" font-size="11" fill="#145A32">React 18 + Vite + TypeScript build</text>

  <!-- ECR badge feeding ECS -->
  <rect x="650" y="250" width="280" height="56" rx="8" fill="#D6EAF8" stroke="#2E86C1" stroke-width="2"/>
  <text x="790" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A5276">AWS ECS Fargate</text>
  <text x="790" y="287" text-anchor="middle" font-size="11" fill="#1A5276">Docker Image from ECR  (688 MB)</text>
  <text x="790" y="300" text-anchor="middle" font-size="10" fill="#1A5276">FastAPI + Uvicorn  |  1 vCPU / 2GB  |  Port 8000</text>

  <!-- ECR small badge -->
  <rect x="655" y="252" width="60" height="20" rx="4" fill="#2E86C1"/>
  <text x="685" y="266" text-anchor="middle" font-size="9" fill="white" font-weight="bold">ECR</text>

  <!-- Arrows down -->
  <line x1="190" y1="306" x2="190" y2="338" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="790" y1="306" x2="790" y2="338" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ══════════════════════════════════════════════════════
       LAYER 4: REACT VIEWS (left) + FASTAPI ENDPOINTS (right)
  ══════════════════════════════════════════════════════ -->

  <!-- React Views box -->
  <rect x="28" y="340" width="324" height="225" rx="8" fill="#EAFAF1" stroke="#1E8449" stroke-width="1.5"/>
  <text x="190" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#145A32">React Frontend Views</text>
  <line x1="38" y1="370" x2="342" y2="370" stroke="#1E8449" stroke-width="0.7" stroke-dasharray="3,2"/>
  <text x="44" y="388" font-size="11" fill="#1A3A1A">• IndexSelector — Russell 2000 / S&amp;P 500 picker</text>
  <text x="44" y="406" font-size="11" fill="#1A3A1A">• HomePage — Dashboard &amp; summary statistics</text>
  <text x="44" y="424" font-size="11" fill="#1A3A1A">• CompanyAnalysis — KPIs, stock chart, CEO history</text>
  <text x="44" y="442" font-size="11" fill="#1A3A1A">• OutlierAnalysis — Z-score statistical detection</text>
  <text x="44" y="460" font-size="11" fill="#1A3A1A">• RankingsPage — Cross-company comparisons</text>
  <text x="44" y="478" font-size="11" fill="#1A3A1A">• CompanyArchive — Full metadata browser</text>
  <text x="44" y="496" font-size="11" fill="#1A3A1A">• ChatBot — AI Q&amp;A (RAG-powered)</text>
  <text x="44" y="514" font-size="11" fill="#1A3A1A">• StockChart, ImpactMetrics, MacroContext</text>
  <text x="44" y="532" font-size="11" fill="#1A3A1A">• CEOProfile, Timeline, RecessionBenchmark</text>

  <!-- FastAPI Endpoints box -->
  <rect x="628" y="340" width="324" height="160" rx="8" fill="#EBF5FB" stroke="#2471A3" stroke-width="1.5"/>
  <text x="790" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A5276">FastAPI REST Endpoints</text>
  <line x1="638" y1="370" x2="942" y2="370" stroke="#2471A3" stroke-width="0.7" stroke-dasharray="3,2"/>
  <text x="644" y="388" font-size="11" fill="#1A3A2A">• GET  /api/indices</text>
  <text x="644" y="406" font-size="11" fill="#1A3A2A">• GET  /api/{index}/companies</text>
  <text x="644" y="424" font-size="11" fill="#1A3A2A">• GET  /api/{index}/kpis/{ticker}</text>
  <text x="644" y="442" font-size="11" fill="#1A3A2A">• GET  /api/{index}/stocks/{ticker}</text>
  <text x="644" y="460" font-size="11" fill="#1A3A2A">• GET  /api/{index}/outliers</text>
  <text x="644" y="478" font-size="11" fill="#1A3A2A">• POST /api/chat  →  RAG Chatbot</text>

  <!-- Arrow: FastAPI → RAG Chatbot -->
  <line x1="790" y1="500" x2="790" y2="532" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- RAG Chatbot box -->
  <rect x="628" y="535" width="324" height="130" rx="8" fill="#E8DAEF" stroke="#7D3C98" stroke-width="1.5"/>
  <text x="790" y="556" text-anchor="middle" font-size="12" font-weight="bold" fill="#6C3483">RAG Chatbot  (Runtime AI)</text>
  <line x1="638" y1="563" x2="942" y2="563" stroke="#7D3C98" stroke-width="0.7" stroke-dasharray="3,2"/>
  <text x="644" y="580" font-size="11" fill="#4A235A">LangChain + ChromaDB (vector store)</text>
  <text x="644" y="597" font-size="11" fill="#4A235A">OpenAI Embeddings — context retrieval</text>
  <text x="644" y="614" font-size="11" fill="#4A235A">Knowledge Base (7 MD files → chunks):</text>
  <text x="660" y="631" font-size="10" fill="#6C3483">financial_terms, calculations, ceo_analysis,</text>
  <text x="660" y="647" font-size="10" fill="#6C3483">economic_terms, outlier_methodology, billing</text>

  <!-- ══════════════════════════════════════════════════════
       DATA STORE — center-right, connects FastAPI
  ══════════════════════════════════════════════════════ -->
  <!-- Arrow: FastAPI reads data store -->
  <line x1="790" y1="665" x2="680" y2="720" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="698" y="707" font-size="10" fill="#888">reads at startup</text>

  <!-- Also connect frontend side: React → API calls → back through CloudFront -->
  <!-- Show data store also feeds frontend KPIs via API -->

  <!-- ══════════════════════════════════════════════════════
       PRE-PROCESSED DATA STORE
  ══════════════════════════════════════════════════════ -->
  <rect x="260" y="722" width="490" height="120" rx="8" fill="#FDFEFE" stroke="#717D7E" stroke-width="1.5"/>
  <text x="505" y="745" text-anchor="middle" font-size="12" font-weight="bold" fill="#424949">Pre-processed Data Store  (JSON — baked into Docker image)</text>
  <line x1="270" y1="752" x2="740" y2="752" stroke="#717D7E" stroke-width="0.7" stroke-dasharray="3,2"/>
  <text x="276" y="769" font-size="11" fill="#333">• data/rus2000/stocks/kpis/{ticker}_kpis.json        (~2,000 files)</text>
  <text x="276" y="787" font-size="11" fill="#333">• data/sp500/stocks/kpis/{ticker}_kpis.json           (~500 files)</text>
  <text x="276" y="805" font-size="11" fill="#333">• data/{index}/stocks/validated/{ticker}_validated.json</text>
  <text x="276" y="823" font-size="11" fill="#333">• data/{index}/companies.json + company_metadata.json</text>
  <text x="276" y="841" font-size="11" fill="#333">• sec_ceo_data/ceo_timeline_*.json + *.csv  (CEO timelines)</text>

  <!-- Arrow: Data Store → generated by pipeline -->
  <line x1="505" y1="842" x2="505" y2="892" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="516" y="875" font-size="10" fill="#888">generated by (offline)</text>

