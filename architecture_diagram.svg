  <text x="127" y="987" text-anchor="middle" font-size="10" font-weight="bold" fill="#6C3483">Tier 1 — SEC</text>
  <text x="127" y="1002" text-anchor="middle" font-size="9.5" fill="#4A235A">8-K Item 5.02</text>
  <text x="127" y="1016" text-anchor="middle" font-size="9.5" fill="#4A235A">Claude Sonnet</text>
  <text x="127" y="1030" text-anchor="middle" font-size="9.5" fill="#4A235A">Anti-hallucination</text>

  <rect x="195" y="970" width="110" height="65" rx="5" fill="#A9CCE3" stroke="#2471A3" stroke-width="1"/>
  <text x="250" y="987" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A5276">Tier 2 — Wiki</text>
  <text x="250" y="1002" text-anchor="middle" font-size="9.5" fill="#1A5276">CEO history pages</text>
  <text x="250" y="1016" text-anchor="middle" font-size="9.5" fill="#1A5276">Claude Haiku</text>
  <text x="250" y="1030" text-anchor="middle" font-size="9.5" fill="#1A5276">Web search fallback</text>

  <rect x="318" y="970" width="110" height="65" rx="5" fill="#FAD7A0" stroke="#D35400" stroke-width="1"/>
  <text x="373" y="987" text-anchor="middle" font-size="10" font-weight="bold" fill="#784212">Tier 3 — 10-K</text>
  <text x="373" y="1002" text-anchor="middle" font-size="9.5" fill="#784212">Annual filings</text>
  <text x="373" y="1016" text-anchor="middle" font-size="9.5" fill="#784212">DEF 14A proxy</text>
  <text x="373" y="1030" text-anchor="middle" font-size="9.5" fill="#784212">Claude Sonnet</text>

  <text x="72" y="1055" font-size="11" fill="#4A235A">ReAct loop  (up to 25 turns per company)</text>
  <text x="72" y="1072" font-size="11" fill="#4A235A">Merge + clean + deduplicate timelines</text>
  <text x="72" y="1089" font-size="11" fill="#4A235A">Gap detection + date propagation</text>
  <text x="72" y="1106" font-size="11" fill="#4A235A">→ Output: ceo_timeline_*.json / *.csv</text>
  <text x="72" y="1123" font-size="10" fill="#7D3C98">Covers ~2,000 Russell 2000 + ~500 S&amp;P 500 companies</text>

  <!-- Data Pipeline box -->
  <rect x="500" y="935" width="420" height="200" rx="8" fill="#FDEBD0" stroke="#D35400" stroke-width="1.5"/>
  <text x="710" y="957" text-anchor="middle" font-size="12" font-weight="bold" fill="#784212">Stock Data Pipeline</text>
  <line x1="510" y1="964" x2="910" y2="964" stroke="#D35400" stroke-width="0.7" stroke-dasharray="3,2"/>
  <text x="516" y="981" font-size="11" fill="#5D4037">Step 1: fetch.py — Download OHLCV via yfinance</text>
  <text x="516" y="999" font-size="11" fill="#5D4037">Step 2: validate.py — Clean + normalize records</text>
  <text x="516" y="1017" font-size="11" fill="#5D4037">Step 3: calculate_kpis.py — Price, volume, risk KPIs</text>
  <text x="516" y="1035" font-size="11" fill="#5D4037">Step 4: fetch_macro.py — Recession context (NBER)</text>
  <text x="516" y="1053" font-size="11" fill="#5D4037">Step 5: pipeline.py — Orchestrate end-to-end</text>
  <text x="516" y="1071" font-size="11" fill="#5D4037">Step 6: scheduler.py — Automated refresh</text>
  <text x="516" y="1094" font-size="10" fill="#784212">KPIs: VWAP · ATH · ATL · Beta · Drawdown · Sharpe</text>
  <text x="516" y="1110" font-size="10" fill="#784212">Volatility · Volume trend · Transition impact (90d, 1y)</text>
  <text x="516" y="1126" font-size="10" fill="#784212">Input: russell2000_tickers.csv + sp500_tickers.csv</text>

